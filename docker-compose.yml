services:
  party-clash:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: party-clash
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
      - HOST_PASSWORD=change-moi-avant-de-deployer
      - ADMIN_PASSWORD=change-moi-aussi-avant-de-deployer
    expose:
      - "3000"
    # Dokploy branchera son propre Traefik / domaine sur ce service.
    # En local (hors Dokploy) tu peux décommenter la ligne ci-dessous :
    # ports:
    #   - "3000:3000"
